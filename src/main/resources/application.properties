spring.application.name=tjm
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1000MB
spring.servlet.multipart.file-size-threshold=200MB

# ===============================
# DATABASE CONNECTION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5412/kaveri_lite
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# CRITICAL: 'update' automatically creates and updates database tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Logs the generated SQL to the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specifies the PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JACKSON (JSON) CONFIGURATION
# ===============================
# Ensures null values are omitted from the final JSON payload, keeping it clean
spring.jackson.default-property-inclusion=non_null


tml.controller.host=http://localhost
tml.controller.port=8087
tml.controller.read-endpoint=/spriced/platform/getData